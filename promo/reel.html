<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monokai Modern Contrast — Promo Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121310;
      --paper: #f8f8f2;
      --muted: #99947c;
      --comment: #75715e;
      --pink: #f92672;
      --yellow: #e6db74;
      --green: #a6e22e;
      --cyan: #66d9ef;
      --orange: #fd971f;
      --purple: #ae81ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body {
      font-family: "Outfit", sans-serif;
      color: var(--paper);
    }
    .stage {
      width: 1280px;
      height: 720px;
      margin: 0 auto;
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }
    .slide.active { opacity: 1; }

    .slide-brand {
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%, rgba(249, 38, 114, 0.12), transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(166, 226, 46, 0.08), transparent 55%),
        var(--bg);
    }
    .slide-brand .logo {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(12px);
    }
    .slide-brand.active .logo {
      animation: up 0.7s 0.15s ease forwards;
    }
    .slide-brand h1 {
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 4.2rem;
      letter-spacing: -0.03em;
      line-height: 0.95;
      opacity: 0;
      transform: translateY(16px);
    }
    .slide-brand.active h1 {
      animation: up 0.75s 0.3s ease forwards;
    }
    .slide-brand h1 span {
      display: block;
      font-size: 0.48em;
      font-weight: 500;
      color: var(--muted);
      margin-top: 0.2em;
    }
    .tag {
      margin-top: 1.25rem;
      font-size: 1.15rem;
      color: var(--muted);
      opacity: 0;
      transform: translateY(12px);
    }
    .slide-brand.active .tag {
      animation: up 0.7s 0.5s ease forwards;
    }
    .swatches {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 2rem;
      opacity: 0;
    }
    .slide-brand.active .swatches {
      animation: up 0.7s 0.65s ease forwards;
    }
    .swatches i {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: block;
    }

    .slide-hero {
      background: #0c0d0b;
    }
    .slide-hero .bg {
      position: absolute;
      inset: 0;
      background: url("./hero.png") center/cover no-repeat;
      filter: brightness(0.55) saturate(1.05);
      transform: scale(1.05);
    }
    .slide-hero.active .bg {
      animation: zoom 4.5s ease-out forwards;
    }
    .slide-hero .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(18,19,16,0.92) 0%, rgba(18,19,16,0.55) 45%, rgba(18,19,16,0.25) 100%);
    }
    .slide-hero .copy {
      position: absolute;
      left: 72px;
      bottom: 88px;
      max-width: 520px;
    }
    .slide-hero .copy h2 {
      font-family: "Fraunces", serif;
      font-size: 2.8rem;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
      opacity: 0;
      transform: translateY(14px);
    }
    .slide-hero .copy p {
      font-size: 1.15rem;
      color: var(--muted);
      opacity: 0;
      transform: translateY(14px);
    }
    .slide-hero.active .copy h2 { animation: up 0.7s 0.2s ease forwards; }
    .slide-hero.active .copy p { animation: up 0.7s 0.4s ease forwards; }

    .slide-preview {
      display: grid;
      place-items: center;
      padding: 40px 56px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(117,113,94,0.18), transparent 55%),
        var(--bg);
    }
    .frame {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(117,113,94,0.35);
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7);
      opacity: 0;
      transform: translateY(20px) scale(0.98);
    }
    .slide-preview.active .frame {
      animation: upScale 0.85s 0.15s ease forwards;
    }
    .frame img { display: block; width: 100%; height: auto; }
    .caption {
      position: absolute;
      top: 36px;
      left: 56px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--comment);
      opacity: 0;
    }
    .slide-preview.active .caption {
      animation: up 0.6s 0.1s ease forwards;
    }

    .slide-cta {
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(ellipse 55% 45% at 50% 45%, rgba(249,38,114,0.14), transparent 60%),
        var(--bg);
    }
    .slide-cta h2 {
      font-family: "Fraunces", serif;
      font-size: 3.2rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      opacity: 0;
      transform: translateY(14px);
    }
    .slide-cta p {
      color: var(--muted);
      font-size: 1.2rem;
      margin-bottom: 1.75rem;
      opacity: 0;
      transform: translateY(14px);
    }
    .pill {
      display: inline-block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 1rem;
      background: #1a1b17;
      border: 1px solid rgba(117,113,94,0.4);
      padding: 1rem 1.4rem;
      border-radius: 6px;
      color: var(--cyan);
      opacity: 0;
      transform: translateY(14px);
    }
    .pill .g { color: var(--green); }
    .slide-cta.active h2 { animation: up 0.7s 0.15s ease forwards; }
    .slide-cta.active p { animation: up 0.7s 0.3s ease forwards; }
    .slide-cta.active .pill { animation: up 0.7s 0.45s ease forwards; }

    @keyframes up {
      to { opacity: 1; transform: none; }
    }
    @keyframes upScale {
      to { opacity: 1; transform: none; }
    }
    @keyframes zoom {
      to { transform: scale(1.12); }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- 0: Brand -->
    <div class="slide slide-brand active" data-duration="3200">
      <div>
        <img class="logo" src="./icon.png" alt="" width="72" height="72" />
        <h1>Monokai<span>Modern Contrast</span></h1>
        <p class="tag" data-i18n="reelTag">Classic Monokai. Quieter chrome.</p>
        <div class="swatches" aria-hidden="true">
          <i style="background:#F92672"></i>
          <i style="background:#E6DB74"></i>
          <i style="background:#A6E22E"></i>
          <i style="background:#66D9EF"></i>
          <i style="background:#FD971F"></i>
          <i style="background:#AE81FF"></i>
        </div>
      </div>
    </div>

    <!-- 1: Message over hero -->
    <div class="slide slide-hero" data-duration="3800">
      <div class="bg"></div>
      <div class="veil"></div>
      <div class="copy">
        <h2 data-i18n="reelHeroTitle" data-i18n-html>Pink where it matters.<br/>Chrome stays quiet.</h2>
        <p data-i18n="reelHeroCopy">Classic keywords. Olive workbench. No extra neon.</p>
      </div>
    </div>

    <!-- 2: Real preview -->
    <div class="slide slide-preview" data-duration="4000">
      <p class="caption" data-i18n="reelCaption">In VS Code / Cursor</p>
      <div class="frame">
        <img src="./preview.png" data-i18n-attr="alt:reelPreviewAlt" alt="Theme preview" width="1366" height="730" />
      </div>
    </div>

    <!-- 3: CTA -->
    <div class="slide slide-cta" data-duration="4200">
      <div>
        <h2 data-i18n="reelCtaTitle">Install it today.</h2>
        <p data-i18n="reelCtaCopy">Free on the Marketplace · MIT · Bektor</p>
        <div class="pill"><span class="g">ext install</span> AdrianTafoya.monokai-modern-contrast</div>
      </div>
    </div>
  </div>

  <script src="./i18n.js"></script>
  <script>
    MMC_I18N.init();

    const slides = [...document.querySelectorAll(".slide")];
    let i = 0;
    let looping = true;

    function show(n) {
      slides.forEach((s, idx) => s.classList.toggle("active", idx === n));
    }

    function next() {
      if (!looping) return;
      i = (i + 1) % slides.length;
      show(i);
      const ms = Number(slides[i].dataset.duration) || 3500;
      setTimeout(next, ms);
    }

    setTimeout(next, Number(slides[0].dataset.duration) || 3200);

    function fit() {
      const stage = document.getElementById("stage");
      const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
      stage.style.transformOrigin = "top center";
      stage.style.transform = `scale(${scale})`;
      document.body.style.height = `${720 * scale}px`;
    }
    fit();
    window.addEventListener("resize", fit);
  </script>
</body>
</html>
